name: C端 打包 exe

on:
  push:
    tags:
      - 'v*'
    paths:
      - "client/**"
      - ".github/workflows/client-package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: client/backend/requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build frontend
        shell: bash
        run: |
          cd client/frontend
          npm ci
          npm run build

      - name: Install backend deps
        shell: bash
        run: |
          cd client/backend
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build installer
        shell: bash
        env:
          # Git Bash(MSYS2) 会把 /DMyAppVersion=... 转换成 Windows 路径，
          # iscc 于是看到两个脚本文件而报错 → 关闭参数路径转换
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 手动 dispatch 到 feature 分支时 ref_name 可能含 / 等文件名非法字符，
          # 清洗进版本号（tag v1.2.3 → 1.2.3 不受影响）
          VERSION="$(printf '%s' "$VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          cd client/packaging/build
          rm -rf dist build_py
          python -m PyInstaller build.spec --clean --noconfirm --workpath build_py
          iscc /DMyAppVersion=$VERSION installer.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Novel-Setup
          path: client/packaging/dist/AI_Novel_Setup_*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: client/packaging/dist/AI_Novel_Setup_*.exe
