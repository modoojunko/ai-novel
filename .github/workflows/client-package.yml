name: C端 打包 exe

on:
  push:
    tags:
      - 'v*'
    paths:
      - "client/**"
      - ".github/workflows/client-package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: client/backend/requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build frontend
        shell: bash
        run: |
          cd client/frontend
          npm ci
          npm run build

      - name: Install backend deps
        shell: bash
        run: |
          cd client/backend
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build installer
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd client/packaging/build
          rm -rf dist build_py
          python -m PyInstaller build.spec --clean --noconfirm --workpath build_py
          iscc installer.iss /DMyAppVersion=$VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Novel-Setup
          path: client/packaging/dist/AI_Novel_Setup_*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: client/packaging/dist/AI_Novel_Setup_*.exe
