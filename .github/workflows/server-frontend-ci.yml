name: S端 前端 CI

on:
  push:
    paths:
      - "server/frontend/**"
      - ".github/workflows/server-frontend-ci.yml"
  pull_request:
    paths:
      - "server/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx vue-tsc --noEmit
      - name: Build
        run: npm run build
      # PR CI 无 secrets：探针在此仅输出「未配置备案号」告警验证脚本可运行；
      # 真正的产物断言（配置号码必在产物）由 s-server-deploy 部署线执行
      - name: 备案产物探针
        run: npm run probe:beian
