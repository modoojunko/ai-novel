name: S端 前端 CI

on:
  push:
    paths:
      - "server/frontend/**"
      - ".github/workflows/server-frontend-ci.yml"
  pull_request:
    paths:
      - "server/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx vue-tsc --noEmit
      - name: Build
        run: npm run build
