name: key fingerprint probe
on:
  workflow_dispatch:

jobs:
  fp:
    runs-on: ubuntu-latest
    steps:
      - name: print masked fingerprints
        run: |
          K="${{ secrets.TCB_API_KEY }}"
          echo "TCB_API_KEY: len=${#K}"
          echo "TCB_API_KEY: head=${K:0:24}"
          echo "TCB_API_KEY: tail=${K: -16}"
          echo "env_id=${{ vars.TCB_ENV_ID }}"
