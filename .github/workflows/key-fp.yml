name: key fingerprint probe
on:
  workflow_dispatch:

jobs:
  fp:
    runs-on: ubuntu-latest
    steps:
      - name: print masked fingerprint of TCB_PG_API_KEY
        run: |
          K="${{ secrets.TCB_PG_API_KEY }}"
          echo "len=${#K}"
          echo "head=${K:0:24}"
          echo "tail=${K: -16}"
          echo "env_id=${{ vars.TCB_ENV_ID }}"
