name: Backend CI

on:
  push:
    paths:
      - "client/backend/**"
      - "server/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "client/backend/**"
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (client/backend)
        working-directory: client/backend
        continue-on-error: true
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff

      - name: Ruff check (client/backend)
        working-directory: client/backend
        continue-on-error: true
        run: ruff check . 2>/dev/null || echo "no client/backend or ruff check failed"

      - name: Install dependencies (server)
        working-directory: server
        continue-on-error: true
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff

      - name: Ruff check (server)
        working-directory: server
        continue-on-error: true
        run: ruff check . 2>/dev/null || echo "no server/ or ruff check failed"
