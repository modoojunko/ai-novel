name: S端 自动发布 CloudBase

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/s-server-deploy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "checkout 的分支/tag/commit（默认 main；可用于部署 feature 分支）"
        required: false
        default: "main"

permissions:
  contents: read

# 串行化部署：连续合 PR 会触发多条 run 并发，tcb 平台侧同时只允许一个部署任务，
# 相撞会卡在「已有部署任务运行」交互提示上以 exit 130 失败。
# 不用 cancel-in-progress：中途取消同样会让下一条 run 撞上平台侧进行中的部署；
# 排队等待虽会多跑几轮，但每轮都部署当时的最新 main，最终状态必为最新。
concurrency:
  group: s-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 tcb CLI
        run: npm install -g @cloudbase/cli

      - name: 登录（环境 API Key，无账号交互）
        run: tcb login --cloudbase-api-key ${{ secrets.TCB_API_KEY }} -e ${{ vars.TCB_ENV_ID }}

      # ── 后端：云托管（云端构建镜像，本地无需 Docker）──
      # 用 secrets 生成部署配置（仓库内 cloudbaserc.json 只放占位符，凭据不入库）。
      # ⚠️ envParams 是每次部署的全量覆盖：云托管控制台手动加的环境变量会被这里
      #    冲掉——新增环境变量必须同步补进本配置。PAYMENTS_GATEWAY/CRON_TOKEN/
      #    SERVERCHAN_SENDKEY 未配 secrets 时注入空串，后端语义均安全
      #    （空 gateway 回落 mock；空 cron token fail-closed；空 SendKey 降级日志）。
      - name: 生成后端部署配置
        run: |
          cat > server/cloudbaserc.json <<'EOF'
          {
            "envId": "${{ vars.TCB_ENV_ID }}",
            "cloudrun": {
              "name": "novel-s-server",
              "serverType": "container",
              "openAccessTypes": ["PUBLIC"],
              "envParams": {
                "DB_BACKEND": "pg_http",
                "TCB_PG_ENV_ID": "${{ vars.TCB_ENV_ID }}",
                "TCB_PG_API_KEY": "${{ secrets.TCB_API_KEY }}",
                "JWT_SECRET": "${{ secrets.JWT_SECRET }}",
                "ADMIN_TOKEN": "${{ secrets.ADMIN_TOKEN }}",
                "PAYMENTS_GATEWAY": "${{ secrets.PAYMENTS_GATEWAY }}",
                "CRON_TOKEN": "${{ secrets.CRON_TOKEN }}",
                "SERVERCHAN_SENDKEY": "${{ secrets.SERVERCHAN_SENDKEY }}"
              }
            }
          }
          EOF

      # 后端测试门禁：路由失挂（import 副作用被删致 /api/web/login 404）这类
      # 只有进程内集成测试能抓到的缺陷，必须在发布前拦截。conftest 自带
      # DATABASE_URL（临时 sqlite），无需任何外部依赖；失败即中止部署。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 后端测试门禁（pytest 全绿才放行部署）
        working-directory: server
        run: |
          pip3 install --quiet -r requirements.txt pytest
          python3 -m pytest tests -q

      # 生产 schema 门禁（design D5）：代码上线而 DDL 漏执行的漂移在发布前拦截。
      # 判定逻辑与后端启动自检同源（app/infrastructure/pg_schema.py）。
      # 探测失败按 fail-closed 中止（防网络抖动放行），re-run 即可重试。
      - name: 生产 schema 门禁（缺表/列即中止部署）
        run: |
          pip3 install --quiet httpx
          python3 server/scripts/pg_gate.py
        env:
          TCB_PG_ENV_ID: ${{ vars.TCB_ENV_ID }}
          TCB_PG_API_KEY: ${{ secrets.TCB_API_KEY }}

      - name: 部署后端（novel-s-server）
        # printf 回答灰度提问（No=部署成功后自动切换流量）；--wait 等待构建完成
        run: printf 'n\n' | tcb cloudrun deploy --service-name novel-s-server --source ./server --env-id ${{ vars.TCB_ENV_ID }} --force --wait

      # ── 前端：本地构建 → 静态托管 app（独立域名 + 版本管理）──
      # TCB_BACKEND_DOMAIN 支持两种形态：裸域名（https://<统一域名>）或已带 /api
      # 尾巴——这里先归一化去掉尾部斜杠与 /api 再统一补一次，保证绝不出现 /api/api
      #
      # ⚠️ 备案号注入的两个事实（#204 复盘）：
      # 1. `tcb app deploy` 的 --build-command "" 并不会跳过云端构建——平台侧
      #    会检测 Vite 后用 npm run build 重建并作为线上最终产物，runner 上带
      #    secret 的构建只随包上传、被云端产物覆盖（历史注释「CI 注入失效」同理：
      #    VITE_API_BASE 当年也是被云端重建吃掉后才改写死 .env.production 的）。
      # 2. 云端构建读不到 runner 的 export，但会读包内的 .env 文件。
      # => 把 secret 值生成到 .env.production.local（vite 优先级高于
      #    .env.production，无同键覆盖歧义）：文件仅存在于 runner 工作区，
      #    *.local 在 .gitignore 内永不入库；打包上传后云端按值烘焙 = 变量替换生效。
      - name: 构建前端
        working-directory: server/frontend
        run: |
          npm ci
          BASE="$(printf '%s' "${{ vars.TCB_BACKEND_DOMAIN }}" | sed -E 's#/*$##; s#/api$##')"
          export VITE_API_BASE="${BASE}/api"
          export VITE_BEIAN_ICP="${{ secrets.VITE_BEIAN_ICP }}"
          export VITE_BEIAN_POLICE="${{ secrets.VITE_BEIAN_POLICE }}"
          export VITE_BEIAN_POLICE_LINK="${{ secrets.VITE_BEIAN_POLICE_LINK }}"
          # VITE_API_BASE 一并落盘：云端重建读包内 .env，runner 的 export 会被
          # 吃掉；.env.production 另有同名兜底值，不一致时以这里（Variable）为准。
          {
            printf 'VITE_API_BASE=%s\n' "$VITE_API_BASE"
            printf 'VITE_BEIAN_ICP=%s\n' "$VITE_BEIAN_ICP"
            printf 'VITE_BEIAN_POLICE=%s\n' "$VITE_BEIAN_POLICE"
            printf 'VITE_BEIAN_POLICE_LINK=%s\n' "$VITE_BEIAN_POLICE_LINK"
          } > .env.production.local
          npm run build && npm run probe:beian

      - name: 部署前端（novel-s-web）
        # 在根目录执行（与 login 同目录）；--cwd 指定项目目录
        # --ignore 排除 node_modules 等大目录（否则上传数百 MB 卡死）
        run: tcb app deploy novel-s-web --env-id ${{ vars.TCB_ENV_ID }} --cwd server/frontend --install-command "" --build-command "" --output-dir dist --deploy-path / --force --ignore "**/node_modules/**,**/e2e/**,**/playwright-report/**"

      - name: 部署结果
        run: |
          echo "后端: https://novel-s-server-297265-7-1468883265.sh.run.tcloudbase.com"
          echo "前端: https://novel-s-web-ai-novel-test-d1ghsr86ra814c12c.webapps.tcloudbase.com"
