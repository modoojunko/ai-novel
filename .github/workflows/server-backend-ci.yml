name: S端 后端 CI

on:
  push:
    paths:
      - "server/app/**"
      - "server/tests/**"
      - "server/requirements.txt"
      - ".github/workflows/server-backend-ci.yml"
  pull_request:
    paths:
      - "server/app/**"
      - "server/tests/**"
      - "server/requirements.txt"
      - ".github/workflows/server-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install ruff==0.16.3 pytest==9.1.1 pytest-timeout==2.4.0
      - name: Lint
        run: ruff check app/ tests/
      - name: Test
        run: python -m pytest tests/ -v --timeout=60
