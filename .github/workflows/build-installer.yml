name: Build Installer

on:
  push:
    tags:
      - 'v*'  # tag 如 v1.0.0 触发构建
  workflow_dispatch:  # 手动触发

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: client/backend/requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Build frontend
        shell: bash
        run: |
          cd client/frontend
          npm ci
          npm run build

      - name: Install backend dependencies
        shell: bash
        run: |
          cd client/backend
          pip install -r requirements.txt

      - name: Install packaging tools
        shell: bash
        run: |
          pip install pyinstaller pywebview

      - name: Build installer
        shell: bash
        run: |
          # 从 tag 提取版本号 (v1.0.0 → 1.0.0)
          VERSION="${GITHUB_REF_NAME#v}"
          cd client/packaging/build
          rm -rf dist build_py
          python -m PyInstaller build.spec --clean --noconfirm --workpath build_py
          iscc installer.iss /DMyAppVersion=$VERSION

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Novel-Setup
          path: client/packaging/dist/AI_Novel_Setup_*.exe

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: client/packaging/dist/AI_Novel_Setup_*.exe
