name: Frontend CI

on:
  push:
    paths:
      - "client/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "client/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: client/frontend
        run: npm ci

      - name: Type check
        working-directory: client/frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: client/frontend
        run: npm run build
