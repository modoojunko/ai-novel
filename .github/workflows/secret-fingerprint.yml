name: secret-fingerprint
on:
  workflow_dispatch:
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: fingerprint
        env:
          K: ${{ secrets.TCB_API_KEY }}
        run: |
          python3 - <<'EOF'
          import hashlib, os
          k = os.environ["K"]
          print("len:", len(k))
          print("head6:", k[:6], " tail6:", k[-6:])
          print("sha256:", hashlib.sha256(k.encode()).hexdigest())
          EOF
