<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>原型 · 下载弹窗（Open Design v2）</title>
<style>
/* ═══ 令牌：与 server/frontend/src/design/base.css 一字不改 ═══ */
:root {
  --bg:      oklch(98% 0.004 240);
  --surface: oklch(100% 0 0);
  --fg:      oklch(20% 0.02 240);
  --muted:   oklch(50% 0.018 240);
  --border:  oklch(90% 0.006 240);
  --accent: oklch(48% 0.11 170);
  --accent-strong: oklch(41% 0.10 170);
  --accent-soft:   color-mix(in oklch, var(--accent) 12%, transparent);
  --ok:    oklch(52% 0.11 155);  --ok-soft:   color-mix(in oklch, var(--ok) 14%, transparent);
  --warn:  oklch(50% 0.13 75);   --warn-soft: color-mix(in oklch, var(--warn) 16%, transparent);
  --fg-soft: color-mix(in oklch, var(--fg) 5%, transparent);
  --shadow-card: 0 1px 2px color-mix(in oklch, var(--fg) 5%, transparent),
                 0 12px 32px -12px color-mix(in oklch, var(--fg) 14%, transparent);
  --font-display: 'Noto Serif SC', 'Songti SC', 'STSong', 'Iowan Old Style', Georgia, serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
  --radius: 10px; --radius-lg: 16px;
}
*, *::after, *::before { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.55; }

/* 基础组件（节选自 base.css） */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 15px; border-radius: var(--radius); border: 1px solid transparent; font-size: 13.5px; font-weight: 500; letter-spacing: 0.01em; line-height: inherit; cursor: pointer; transition: background .15s ease, border-color .15s ease; font-family: inherit; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--surface); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-secondary { background: var(--surface); color: var(--fg); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--fg); }
.btn-lg { height: 40px; padding: 0 20px; font-size: 14.5px; }
.btn svg { width: 15px; height: 15px; }
.lnk { color: var(--accent); }
.lnk:hover { color: var(--accent-strong); text-decoration: underline; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.skel { position: relative; overflow: hidden; height: 14px; border-radius: 7px; background: var(--fg-soft); }
.skel::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in oklch, var(--surface) 70%, transparent), transparent); animation: shimmer 1.1s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin .9s linear infinite; }

/* ── 弹窗（.modal/.mcard 同 base.css） ── */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; background: color-mix(in oklch, var(--fg) 45%, transparent); }
.mcard { width: min(420px, 92vw); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); transform: translateY(8px) scale(.98); opacity: 0; transition: transform .18s ease, opacity .18s ease; }
.modal.show .mcard { transform: none; opacity: 1; }
.mclose { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 8px; }
.mclose:hover { color: var(--fg); background: var(--fg-soft); }
.mclose svg { width: 15px; height: 15px; }

/* 弹窗内容排版 */
.mhead { padding: 26px 28px 0; }
.mbody { padding: 18px 28px 26px; display: flex; flex-direction: column; gap: 12px; }
.mtitle { margin: 10px 0 0; font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: .01em; }
.msub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.dl-btn { width: 100%; }
.dl-note { display: flex; justify-content: space-between; margin: -4px 0 0; font-size: 12px; color: var(--muted); }
.mfoot { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }

/* 演示页容器 */
.demo { max-width: 760px; margin: 0 auto; padding: 40px 24px; }
.demo h1 { font-family: var(--font-display); font-size: 22px; }
.switch { display: flex; gap: 8px; margin: 16px 0 28px; }
.icon { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="demo">
  <h1>下载弹窗 · 三态原型</h1>
  <p style="color:var(--muted);margin:8px 0 0">触发按钮即 Hero 主按钮「免费下载」（未登录态唯一主操作）。切换下方状态查看弹窗。</p>
  <div class="switch">
    <button class="btn btn-secondary" onclick="show('loading')">加载中</button>
    <button class="btn btn-secondary" onclick="show('ok')">成功</button>
    <button class="btn btn-secondary" onclick="show('warn')">获取失败（降级）</button>
  </div>
</div>

<div class="modal show" id="m">
  <div class="mcard">
    <button class="mclose" onclick="show('close')" aria-label="关闭">
      <svg viewBox="0 0 24 24" class="icon"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <!-- 加载态 -->
    <div id="s-loading">
      <div class="mhead">
        <h2 class="mtitle">下载爱小说</h2>
        <p class="msub">正在获取最新版本…</p>
      </div>
      <div class="mbody">
        <div class="skel" style="width:78%"></div>
        <div class="skel" style="width:56%"></div>
        <div class="skel" style="width:40%"></div>
      </div>
    </div>

    <!-- 成功 / 降级态（同一结构，pill 语气与版本号由数据决定） -->
    <div id="s-data" hidden>
      <div class="mhead">
        <span class="pill info" id="ver-pill">最新版 v0.12</span>
        <h2 class="mtitle">下载爱小说</h2>
        <p class="msub">选择你的系统，安装后注册即送 7 天全功能试用</p>
      </div>
      <div class="mbody">
        <button class="btn btn-primary btn-lg dl-btn" onclick="fakeDl('exe')">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 4v11M7 11l5 5 5-5M4 20h16"/></svg>
          下载 Windows 版
        </button>
        <div class="dl-note"><span>Windows 安装包</span><span>.exe</span></div>
        <button class="btn btn-secondary btn-lg dl-btn" onclick="fakeDl('dmg')">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 4v11M7 11l5 5 5-5M4 20h16"/></svg>
          下载 macOS 版
        </button>
        <div class="dl-note"><span>macOS 磁盘镜像</span><span>.dmg</span></div>
        <div class="mfoot">
          <span>macOS 首次打开若提示无法验证开发者：右键 App → 「打开」</span>
        </div>
        <div style="text-align:center">
          <a class="lnk" href="#" onclick="return false">查看其他版本 →</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
function show(state) {
  if (state === 'close') { $('m').style.display = 'none'; return; }
  $('m').style.display = '';
  $('s-loading').hidden = state !== 'loading';
  $('s-data').hidden = state === 'loading';
  const pill = $('ver-pill');
  if (state === 'ok')   { pill.className = 'pill info'; pill.textContent = '最新版 v0.12'; }
  if (state === 'warn') { pill.className = 'pill warn'; pill.textContent = '未能获取最新版，当前 v0.11'; }
}
// 演示：真实实现中 href 为静态托管版本化直链，直接跳转下载
function fakeDl() {}
show('ok');
</script>
</body>
</html>
