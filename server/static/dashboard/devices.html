<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>设备管理 - 爱小说</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:#f5f0eb;color:#2c1810;min-height:100vh}
.page-header{background:#fff;border-bottom:1px solid #e8ddd5;padding:24px 32px;display:flex;align-items:center;justify-content:space-between}
.page-header h1{font-size:20px;font-weight:600}
.back-link{color:#8b7355;text-decoration:none;font-size:14px;display:flex;align-items:center;gap:4px}
.back-link:hover{color:#2c1810}
.capacity{font-size:14px;color:#8b7355}
.content{max-width:720px;margin:0 auto;padding:32px 16px}
/* Loading skeleton */
.skeleton-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:12px;border:1px solid #e8ddd5}
.skeleton-card .s-line{height:14px;background:#f0ebe6;border-radius:6px;margin-bottom:10px}
.skeleton-card .s-line:last-child{width:60%;margin-bottom:0}
.skeleton-card .s-line.s-h{height:20px;width:40%}
/* Empty state */
.empty-state{text-align:center;padding:60px 20px;background:#fff;border-radius:12px;border:1px dashed #e8ddd5}
.empty-state .empty-icon{font-size:48px;margin-bottom:16px;opacity:0.5}
.empty-state h3{font-size:18px;font-weight:500;margin-bottom:8px;color:#5c4033}
.empty-state p{font-size:14px;color:#8b7355;margin-bottom:20px}
.btn-download{display:inline-block;padding:10px 24px;background:#8b7355;color:#fff;border:none;border-radius:8px;font-size:14px;text-decoration:none;cursor:pointer}
.btn-download:hover{background:#6b5a42}
/* Error state */
.error-state{text-align:center;padding:60px 20px;background:#fff;border-radius:12px;border:1px solid #f8d7da}
.error-state .error-icon{font-size:48px;margin-bottom:16px}
.error-state h3{font-size:18px;font-weight:500;margin-bottom:8px;color:#721c24}
.error-state p{font-size:14px;color:#8b7355}
/* Device card */
.device-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:12px;transition:box-shadow .2s;position:relative;overflow:hidden}
.device-card.card-activated{border:1px solid #d4edda;border-left:4px solid #28a745}
.device-card.card-deactivated{border:1px solid #e8ddd5;border-left:4px solid #d0c8c0;opacity:0.85}
.card-body{display:flex;align-items:flex-start;gap:16px}
.device-icon{font-size:32px;flex-shrink:0;width:40px;text-align:center}
.device-info{flex:1;min-width:0}
.device-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.device-name{font-size:16px;font-weight:600}
.device-name.muted{color:#8b7355}
.activation-dot{font-size:12px;font-weight:500;padding:2px 8px;border-radius:10px}
.activation-dot.green{background:#d4edda;color:#155724}
.activation-dot.gray{background:#f0ebe6;color:#8b7355}
.badge-recent{font-size:11px;background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:10px;font-weight:500}
.device-os{font-size:13px;margin-bottom:4px}
.device-os.muted{color:#8b7355}
.device-meta{font-size:12px;display:flex;gap:16px}
.device-meta.muted{color:#b8a89a}
.upgrade-guide{margin-top:10px;padding:10px 14px;background:#fff8e1;border-radius:8px;font-size:13px;color:#8b6f00;line-height:1.5}
</style>
</head><body>

<div class="page-header">
  <a href="/dashboard" class="back-link">← 个人中心</a>
  <h1>我的设备</h1>
  <span class="capacity" id="capacity"></span>
</div>

<div class="content">
  <!-- Loading -->
  <div id="loading">
    <div class="skeleton-card"><div class="s-line s-h"></div><div class="s-line"></div><div class="s-line" style="width:50%"></div></div>
    <div class="skeleton-card"><div class="s-line s-h"></div><div class="s-line"></div><div class="s-line" style="width:50%"></div></div>
    <div class="skeleton-card"><div class="s-line s-h"></div><div class="s-line"></div><div class="s-line" style="width:50%"></div></div>
  </div>

  <!-- Empty State -->
  <div id="empty" class="empty-state" style="display:none">
    <div class="empty-icon">📟</div>
    <h3>还没有注册设备</h3>
    <p>首次从 C端 登录授权后，设备会自动注册到这里</p>
    <a href="/download" class="btn-download">📥 下载 C端</a>
  </div>

  <!-- Error State -->
  <div id="errorView" class="error-state" style="display:none">
    <div class="error-icon">⚠️</div>
    <h3 id="errorTitle">加载失败</h3>
    <p id="errorDesc">请检查网络连接后重试</p>
  </div>

  <!-- Device List -->
  <div id="device-list" style="display:none"></div>
</div>

<script>
function getTokenFromURL() {
  const hash = window.location.hash;
  const params = new URLSearchParams(hash.startsWith('#') ? hash.slice(1) : '');
  return params.get('jwt') || '';
}

function showLoading() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('empty').style.display = 'none';
  document.getElementById('errorView').style.display = 'none';
  document.getElementById('device-list').style.display = 'none';
}

function showEmptyState() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('empty').style.display = 'block';
  document.getElementById('errorView').style.display = 'none';
  document.getElementById('device-list').style.display = 'none';
}

function showError(title, desc) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('empty').style.display = 'none';
  document.getElementById('errorView').style.display = 'block';
  document.getElementById('device-list').style.display = 'none';
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorDesc').textContent = desc;
}

function showList() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('empty').style.display = 'none';
  document.getElementById('errorView').style.display = 'none';
  document.getElementById('device-list').style.display = 'block';
}

function renderCard(device) {
  const isActivated = device.activated;
  const borderClass = isActivated ? 'card-activated' : 'card-deactivated';
  const iconOpacity = isActivated ? '' : 'opacity-40';
  const nameClass = isActivated ? '' : 'muted';
  const textClass = isActivated ? '' : 'muted';
  const metaClass = isActivated ? '' : 'muted';

  let badgeHtml = isActivated
    ? '<span class="activation-dot green">● 已激活</span>'
    : '<span class="activation-dot gray">○ 未激活</span>';

  let recentBadge = device.is_current
    ? '<span class="badge-recent">最近使用</span>' : '';

  let guideHtml = '';
  if (!isActivated && device.reason) {
    guideHtml = '<div class="upgrade-guide">⚡ ' + device.reason.message + '</div>';
  }

  const osText = device.os || '未知系统';
  const lastActive = device.last_active_at
    ? new Date(device.last_active_at).toLocaleString('zh-CN')
    : '-';
  const boundAt = device.bound_at
    ? new Date(device.bound_at).toLocaleString('zh-CN')
    : '-';

  return '<div class="device-card ' + borderClass + '">' +
    '<div class="card-body">' +
      '<div class="device-icon ' + iconOpacity + '">🖥️</div>' +
      '<div class="device-info">' +
        '<div class="device-header">' +
          '<span class="device-name ' + nameClass + '">' + device.hostname + '</span>' +
          badgeHtml + recentBadge +
        '</div>' +
        '<div class="device-os ' + textClass + '">' + osText + '</div>' +
        '<div class="device-meta ' + metaClass + '">' +
          '<span>最近活动：' + lastActive + '</span>' +
          '<span>绑定：' + boundAt + '</span>' +
        '</div>' +
        guideHtml +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderDevices(data) {
  var devices = data.devices;
  var total_count = data.total_count;
  var activated_count = data.activated_count;
  var active_limit = data.active_limit;

  document.getElementById('capacity').textContent =
    '共 ' + total_count + ' 台设备 · 已激活 ' + activated_count + ' 台（限额 ' + active_limit + ' 台）';

  if (devices.length === 0) {
    showEmptyState();
    return;
  }

  var list = document.getElementById('device-list');
  list.innerHTML = devices.map(function(d) { return renderCard(d); }).join('');
  showList();
}

async function loadDevices() {
  var token = getTokenFromURL();
  if (!token) {
    showError('未登录', '请先登录后查看设备列表');
    return;
  }

  showLoading();

  try {
    var resp = await fetch('/api/devices', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (resp.status === 401) {
      showError('登录已过期', '请重新登录后查看');
      return;
    }
    if (!resp.ok) {
      showError('加载失败', '服务器返回错误: ' + resp.status);
      return;
    }
    var data = await resp.json();
    renderDevices(data);
  } catch (e) {
    showError('网络错误', '无法连接到服务器，请检查网络后重试');
  }
}

loadDevices();
lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
</script>
</body></html>
