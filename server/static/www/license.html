<div id="licenseContent">
  <div class="sd-plan-card" style="margin-bottom:var(--space-5);">
    <p class="plan-label">当前套餐</p>
    <p class="plan-value" id="tierDisplay">-</p>
    <p class="plan-meta">
      <span style="display:inline-flex;align-items:center;gap:var(--space-1);font-size:0.85rem;opacity:0.75;">
        到期日：<span id="expiresDisplay">-</span>
      </span>
    </p>
  </div>
  <h4 style="font-family:var(--font-serif);font-size:0.95rem;font-weight:600;color:var(--co-ink);margin-bottom:var(--space-3);">
    历史激活码
  </h4>
  <div id="codeList"></div>
</div>
<script>
window.pageInit = function(user) {
  const tierMap = { monthly:'月付', quarterly:'季付', yearly:'年付', lifetime:'永久', none:'无套餐' };
  document.getElementById('tierDisplay').textContent = tierMap[user.tier] || user.tier;
  document.getElementById('expiresDisplay').textContent = user.expires_at ? new Date(user.expires_at).toLocaleDateString('zh-CN') : '-';
  const list = document.getElementById('codeList');
  if (!user.codes || user.codes.length === 0) {
    list.innerHTML = '<div class="sd-empty-state"><div class="empty-icon" style="font-size:2.5rem;margin-bottom:var(--space-3);opacity:0.4;">🔑</div><div class="empty-title">暂无激活记录</div><div class="empty-desc">在淘宝购买激活码后绑定到你的账号</div></div>';
    return;
  }
  list.innerHTML = user.codes.map(function(c) {
    const exp = c.expires_at ? new Date(c.expires_at).toLocaleDateString('zh-CN') : '-';
    const act = c.activated_at ? new Date(c.activated_at).toLocaleDateString('zh-CN') : '-';
    const isYearly = c.tier === 'yearly';
    const isLifetime = c.tier === 'lifetime';
    const tierClass = isLifetime ? 'tier-tag-lifetime' : (isYearly ? 'tier-tag-yearly' : 'tier-tag-monthly');
    const tierName = tierMap[c.tier] || c.tier;
    return '<div class="item">' +
      '<code>' + c.code_id + '</code>' +
      '<span class="meta"><span class="tier-tag ' + tierClass + '">' + tierName + '</span></span>' +
      '<span class="meta">激活 ' + act + '</span>' +
      '<span class="meta">到期 ' + exp + '</span>' +
    '</div>';
  }).join('');
};
</script>
