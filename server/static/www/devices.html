<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设备管理 - 爱小说</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
<div class="dashboard">
  <aside class="sidebar">
    <div class="logo">
      <span class="brand-icon" data-lucide="book-open"></span>
      爱小说
    </div>
    <nav>
      <a href="/dashboard">
        <span class="nav-icon" data-lucide="layout-dashboard"></span>
        控制台
      </a>
      <a href="/dashboard#license">
        <span class="nav-icon" data-lucide="key"></span>
        我的 License
      </a>
      <a href="/dashboard#devices" class="active">
        <span class="nav-icon" data-lucide="monitor"></span>
        设备管理
      </a>
      <a href="/dashboard#account">
        <span class="nav-icon" data-lucide="settings"></span>
        账号设置
      </a>
    </nav>
    <div class="sidebar-footer">
      <span>v0.2</span>
      <span data-lucide="book-open" style="width:14px;height:14px;opacity:0.3;"></span>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <span id="planBadge" class="sd-plan-badge">
        <span data-lucide="crown" style="width:14px;height:14px;"></span>
        -
      </span>
      <div class="sd-user-area">
        <span class="sd-user-avatar" id="userAvatar">-</span>
        <span class="sd-user-name" id="userName">-</span>
      </div>
      <a href="#" class="exit-link" onclick="logout()">退出</a>
    </div>
    <div class="sd-content">
      <div class="sd-subpage">
        <div class="subpage-header">
          <div class="subpage-icon" data-lucide="monitor" style="background:linear-gradient(135deg,var(--co-brown-light),var(--co-brown-mid));"></div>
          <div class="subpage-info">
            <h3>设备管理</h3>
            <p>管理已授权的设备 · 最多绑定 3 台</p>
          </div>
        </div>
        <div id="deviceList">
          <div class="sd-empty-state">
            <div class="empty-icon" data-lucide="monitor" style="width:40px;height:40px;margin:0 auto var(--space-3);opacity:0.3;"></div>
            <div class="empty-title">暂无绑定设备</div>
            <div class="empty-desc">打开 C端 客户端，通过浏览器登录授权后<br>当前设备会自动显示在此处</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/api.js"></script>
<script>
const TOKEN = localStorage.getItem('token');
if (!TOKEN) { window.location.href = '/login'; }

// Load user info
(async function init() {
  try {
    const r = await request('/user/me');
    if (r.code === 0 && r.data) {
      document.getElementById('userName').textContent = r.data.username || '-';
      document.getElementById('userAvatar').textContent = (r.data.username || 'U').charAt(0);
      const tierNames = { monthly:'月付', yearly:'年付', lifetime:'永久', none:'无套餐' };
      document.getElementById('planBadge').innerHTML = '<span data-lucide="crown" style="width:14px;height:14px;"></span> ' + (tierNames[r.data.tier] || r.data.tier || '-');
      lucide.replaceElement(document.getElementById('planBadge').querySelector('[data-lucide]'), { 'stroke-width': 1.5, width: 14, height: 14 });
    }
  } catch(e) { /* silent */ }
  loadDevices();
})();

async function loadDevices() {
  const res = await request('/device/my');
  const list = document.getElementById('deviceList');
  if (!res.data || res.data.length === 0) {
    list.innerHTML =
      '<div class="sd-empty-state">' +
      '<div class="empty-icon" style="font-size:2.5rem;margin-bottom:var(--space-3);opacity:0.4;">💻</div>' +
      '<div class="empty-title">暂无绑定设备</div>' +
      '<div class="empty-desc">打开 C端 客户端，通过浏览器登录授权后<br>当前设备会自动显示在此处</div>' +
      '</div>';
    return;
  }
  list.innerHTML = res.data.map(d => {
    const last = d.last_active_at ? new Date(d.last_active_at).toLocaleDateString('zh-CN') : '-';
    const name = d.pc_name || '未知设备';
    const isOnline = d.is_online || false;
    return '<div class="sd-device-item">' +
      '<div class="device-info">' +
        '<div class="device-icon">💻</div>' +
        '<div>' +
          '<div class="device-name">' + name + '</div>' +
          '<div class="device-meta">编号 ' + (d.pc_hash||'').slice(0,12) + '… · 最后活跃：' + last + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="device-status">' +
        '<span class="status-dot ' + (isOnline ? 'status-dot-active' : 'status-dot-inactive') + '"></span>' +
        '<span class="status-text" style="' + (isOnline ? '' : 'color:var(--co-brown-light);') + '">' + (isOnline ? '在线' : '离线') + '</span>' +
        '<button class="btn btn-danger btn-sm" style="margin-left:var(--space-3);" onclick="removeDevice(\'' + d.pc_hash + '\')">解绑</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function removeDevice(hash) {
  if (!confirm('确定解绑此设备？')) return;
  const res = await request('/device/remove', { method:'POST', body:JSON.stringify({ pc_hash: hash }) });
  if (res.code === 0) loadDevices();
}

lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
</script>
</body>
</html>
