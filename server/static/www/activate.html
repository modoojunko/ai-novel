<div style="max-width:480px">
  <div class="sd-activate-area" style="border:none;padding:0;background:transparent;">
    <p class="activate-title">激活新码</p>
    <p class="activate-desc">在淘宝购买的激活码，在这里输入绑定到你的账号。到期日会自动叠加。</p>
    <div id="msg" class="msg"></div>
    <div class="activate-input-row">
      <div class="form-input-wrap">
        <span class="input-icon" data-lucide="key" style="width:16px;height:16px;"></span>
        <input type="text" id="code" placeholder="AC-XXXX-YYYY-ZZZZ-WWWW">
      </div>
      <button class="btn btn-primary" onclick="activateCode()">
        <span data-lucide="check-circle" style="width:16px;height:16px;"></span> 激活
      </button>
    </div>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
async function activateCode() {
  const btn = document.querySelector('button'); btn.disabled=true;
  const msg = document.getElementById('msg'); msg.className='msg';
  const code = document.getElementById('code').value.trim().toUpperCase();
  if (!code) { msg.className='msg error'; msg.textContent='请输入激活码'; btn.disabled=false; return; }
  try {
    const res = await request('/license/activate', { method:'POST', body:JSON.stringify({ code }) });
    if (res.code === 0) {
      msg.className='msg success'; msg.textContent='激活成功！到期日已叠加';
      document.getElementById('code').value='';
      setTimeout(() => window.location.hash='#license', 1500);
    } else {
      msg.className='msg error'; msg.textContent=res.msg||'激活失败';
      btn.disabled=false;
    }
  } catch(e) {
    msg.className='msg error'; msg.textContent='请求失败：'+e.message;
    btn.disabled=false;
  }
}
lucide.createIcons({ attrs: { 'stroke-width': 1.5, 'width': 18, 'height': 18 } });
</script>
