<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AI Novel 登录授权</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;padding:36px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.3);width:380px}
.card h1{font-size:24px;text-align:center;margin-bottom:4px}
.card .sub{font-size:14px;color:#888;text-align:center;margin-bottom:24px}
label{display:block;font-size:14px;font-weight:500;margin-bottom:4px;color:#333}
input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:16px;transition:border-color .2s}
input:focus{outline:none;border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,0.15)}
button{width:100%;padding:12px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:500;cursor:pointer;transition:background .2s}
button:hover{background:#1557b0}
button:disabled{background:#93b8f0;cursor:not-allowed}
.msg{margin-top:16px;padding:10px 14px;border-radius:8px;font-size:14px;display:none;text-align:center}
.msg.success{display:block;background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.msg.error{display:block;background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.msg.loading{display:block;background:#e2e3f5;color:#383d41;border:1px solid #d6d8db}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#aaa}
</style></head><body>
<div class="card">
  <h1>AI Novel</h1>
  <p class="sub">登录以授权此设备</p>
  <div id="msg" class="msg"></div>
  <form id="loginForm">
    <label>用户名</label><input type="text" id="username" autocomplete="username" required>
    <label>密码</label><input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">登录授权</button>
  </form>
  <div class="footer">授权后即可关闭此页面</div>
</div>
<script>
const params=new URLSearchParams(window.location.search);
const pcHash=params.get('pc_hash');
const msg=document.getElementById('msg');
const btn=document.getElementById('loginBtn');
document.getElementById('loginForm').onsubmit=async(e)=>{
  e.preventDefault();btn.disabled=true;btn.textContent='授权中...';
  msg.className='msg loading';msg.textContent='正在验证...';
  try{
    const r=await fetch('/api/authorize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      username:document.getElementById('username').value,
      password:document.getElementById('password').value,
      pc_hash:pcHash
    })});
    const d=await r.json();
    if(d.code===0){
      msg.className='msg success';msg.textContent='✅ 授权成功！此页面可以关闭了';
      btn.textContent='✅ 已授权';
    }else{
      msg.className='msg error';msg.textContent='❌ '+(d.msg||'登录失败');
      btn.disabled=false;btn.textContent='登录授权';
    }
  }catch(e){
    msg.className='msg error';msg.textContent='❌ 网络连接失败，请重试';
    btn.disabled=false;btn.textContent='登录授权';
  }
};
</script></body></html>
