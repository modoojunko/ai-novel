{% extends "base.html" %}
{% block title %}登录 - AI Novel{% endblock %}
{% block content %}
<div class="auth-page">
<div class="auth-card">
  <h1>AI Novel</h1>
  <p class="subtitle">登录你的账号</p>
  <div id="msg" class="msg"></div>
  <form id="form">
    <label>用户名</label><input type="text" id="username" autocomplete="username" required>
    <label>密码</label><input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" class="btn" id="btn">登录</button>
  </form>
  <div class="text-center" style="margin-top:18px">
    <a href="/register" class="link">没有账号？注册</a>
  </div>
</div></div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault(); const btn=document.getElementById('btn'); btn.disabled=true;
  const msg=document.getElementById('msg');
  try {
    const r = await fetch('/api/web/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
    const d = await r.json();
    if (d.code===0) { localStorage.setItem('token',d.data.token); document.cookie='token='+d.data.token+';path=/;max-age=604800'; window.location.href='/dashboard'; }
    else { msg.className='msg error'; msg.textContent=d.msg||'登录失败'; btn.disabled=false; }
  } catch(e) { msg.className='msg error'; msg.textContent='网络错误'; btn.disabled=false; }
};
</script>
{% endblock %}
