{% extends "base.html" %}
{% block title %}登录 - 爱小说{% endblock %}
{% block head %}
<script src="https://unpkg.com/lucide@latest"></script>
{% endblock %}
{% block content %}
<div class="auth-page">
<div class="auth-card">
  <a class="auth-brand" href="/">
    <span class="brand-icon" data-lucide="book-open"></span>
    爱小说
  </a>
  <p class="auth-subtitle">登录以管理你的 License<br>和绑定设备</p>
  <div id="msg" class="msg"></div>
  <form id="form">
    <div class="form-group">
      <label class="form-label">用户名</label>
      <div class="form-input-wrap">
        <span class="input-icon" data-lucide="user" style="width:16px;height:16px;"></span>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <div class="form-input-wrap">
        <span class="input-icon" data-lucide="lock" style="width:16px;height:16px;"></span>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-full" id="btn">
      <span data-lucide="log-in" style="width:16px;height:16px;"></span> 登录
    </button>
  </form>
  <div class="auth-divider">还没有账号？</div>
  <a href="/register" class="btn btn-secondary btn-full">
    <span data-lucide="user-plus" style="width:16px;height:16px;"></span> 创建新账号
  </a>
  <div class="auth-footer">
    忘记密码？<a href="#">通过密保问题重置</a>
  </div>
</div></div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault(); const btn=document.getElementById('btn'); btn.disabled=true;
  const msg=document.getElementById('msg');
  try {
    const r = await fetch('/api/web/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
    const d = await r.json();
    if (d.code===0) { localStorage.setItem('token',d.data.token); document.cookie='token='+d.data.token+';path=/;max-age=604800'; window.location.href='/dashboard'; }
    else { msg.className='msg error'; msg.textContent=d.msg||'登录失败'; btn.disabled=false; }
  } catch(e) { msg.className='msg error'; msg.textContent='网络错误'; btn.disabled=false; }
};
lucide.createIcons({ attrs: { 'stroke-width': 1.5, 'width': 18, 'height': 18 } });
</script>
{% endblock %}
