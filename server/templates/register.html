{% extends "base.html" %}
{% block title %}注册 - AI Novel{% endblock %}
{% block content %}
<div class="auth-page">
<div class="auth-card">
  <h1>AI Novel</h1>
  <p class="subtitle">创建你的账号</p>
  <div id="msg" class="msg"></div>
  <form id="form">
    <label>用户名</label><input type="text" id="username" required>
    <label>密码</label><input type="password" id="password" placeholder="至少 6 位" required>
    <label>确认密码</label><input type="password" id="confirmPwd" required>
    <label>密保问题</label><input type="text" id="question" placeholder="例如：我最喜欢的城市是？" required>
    <label>密保答案</label><input type="text" id="answer" required>
    <button type="submit" class="btn" id="btn">创建账号</button>
  </form>
  <div class="text-center" style="margin-top:18px">
    <a href="/login" class="link">已有账号？登录</a>
  </div>
</div></div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault(); const btn=document.getElementById('btn'); btn.disabled=true;
  const msg=document.getElementById('msg');
  const pwd=document.getElementById('password').value;
  if (pwd!==document.getElementById('confirmPwd').value) { msg.className='msg error'; msg.textContent='两次密码不一致'; btn.disabled=false; return; }
  if (pwd.length<6) { msg.className='msg error'; msg.textContent='密码至少6位'; btn.disabled=false; return; }
  try {
    const r = await fetch('/api/web/register',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('username').value,password:pwd,security_question:document.getElementById('question').value,security_answer:document.getElementById('answer').value})});
    const d = await r.json();
    if (d.code===0) { localStorage.setItem('token',d.data.token); document.cookie='token='+d.data.token+';path=/;max-age=604800'; window.location.href='/dashboard'; }
    else { msg.className='msg error'; msg.textContent=d.msg||'注册失败'; btn.disabled=false; }
  } catch(e) { msg.className='msg error'; msg.textContent='网络错误'; btn.disabled=false; }
};
</script>
{% endblock %}
