{% extends "base.html" %}
{% block title %}注册 - 爱小说{% endblock %}
{% block head %}
<script src="https://unpkg.com/lucide@latest"></script>
{% endblock %}
{% block content %}
<div class="auth-page">
<div class="auth-card">
  <a class="auth-brand" href="/">
    <span class="brand-icon" data-lucide="book-open"></span>
    爱小说
  </a>
  <p class="auth-subtitle">创建你的账号<br>开始管理 License 和设备</p>
  <div id="msg" class="msg"></div>
  <form id="form">
    <div class="form-group">
      <label class="form-label">用户名</label>
      <div class="form-input-wrap">
        <span class="input-icon" data-lucide="user" style="width:16px;height:16px;"></span>
        <input type="text" id="username" placeholder="请输入用户名" required>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">密码 <span class="label-hint">至少 6 位</span></label>
      <div class="form-input-wrap">
        <span class="input-icon" data-lucide="lock" style="width:16px;height:16px;"></span>
        <input type="password" id="password" placeholder="至少 6 位" required>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">确认密码</label>
      <div class="form-input-wrap">
        <span class="input-icon" data-lucide="lock" style="width:16px;height:16px;"></span>
        <input type="password" id="confirmPwd" placeholder="再次输入密码" required>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">密保问题</label>
      <div class="form-input-wrap">
        <span class="input-icon" data-lucide="shield-question" style="width:16px;height:16px;"></span>
        <input type="text" id="question" placeholder="例如：我最喜欢的城市是？" required>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">密保答案</label>
      <div class="form-input-wrap">
        <span class="input-icon" data-lucide="shield" style="width:16px;height:16px;"></span>
        <input type="text" id="answer" placeholder="输入答案" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-full" id="btn">
      <span data-lucide="user-plus" style="width:16px;height:16px;"></span> 创建账号
    </button>
  </form>
  <div class="auth-divider">已有账号？</div>
  <a href="/login" class="btn btn-secondary btn-full">
    <span data-lucide="log-in" style="width:16px;height:16px;"></span> 返回登录
  </a>
</div></div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault(); const btn=document.getElementById('btn'); btn.disabled=true;
  const msg=document.getElementById('msg');
  const pwd=document.getElementById('password').value;
  if (pwd!==document.getElementById('confirmPwd').value) { msg.className='msg error'; msg.textContent='两次密码不一致'; btn.disabled=false; return; }
  if (pwd.length<6) { msg.className='msg error'; msg.textContent='密码至少6位'; btn.disabled=false; return; }
  try {
    const r = await fetch('/api/web/register',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('username').value,password:pwd,security_question:document.getElementById('question').value,security_answer:document.getElementById('answer').value})});
    const d = await r.json();
    if (d.code===0) { localStorage.setItem('token',d.data.token); document.cookie='token='+d.data.token+';path=/;max-age=604800'; window.location.href='/dashboard'; }
    else { msg.className='msg error'; msg.textContent=d.msg||'注册失败'; btn.disabled=false; }
  } catch(e) { msg.className='msg error'; msg.textContent='网络错误'; btn.disabled=false; }
};
lucide.createIcons({ attrs: { 'stroke-width': 1.5, 'width': 18, 'height': 18 } });
</script>
{% endblock %}
