<!DOCTYPE html>
<html lang="zh-CN" data-theme="parchment">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>爱小说 · AI Novel</title>
  <script>
    // 首帧主题：在 CSS 应用前写入 data-theme，避免深色主题用户刷新时闪白
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'parchment')
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap"
    rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
