<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>爱小说 · 设备（原型）</title>
<style>
:root {
  --bg: oklch(98% 0.004 240); --surface: oklch(100% 0 0); --fg: oklch(20% 0.02 240); --muted: oklch(50% 0.018 240);
  --border: oklch(90% 0.006 240); --accent: oklch(48% 0.11 170); --accent-strong: oklch(41% 0.10 170);
  --accent-soft: color-mix(in oklch, var(--accent) 12%, transparent);
  --ok: oklch(52% 0.11 155); --ok-soft: color-mix(in oklch, var(--ok) 14%, transparent);
  --warn: oklch(50% 0.13 75); --warn-soft: color-mix(in oklch, var(--warn) 16%, transparent);
  --err: oklch(50% 0.17 25); --err-soft: color-mix(in oklch, var(--err) 12%, transparent);
  --fg-soft: color-mix(in oklch, var(--fg) 5%, transparent); --on-accent: oklch(100% 0 0);
  --shadow-card: 0 1px 2px color-mix(in oklch, var(--fg) 5%, transparent), 0 12px 32px -12px color-mix(in oklch, var(--fg) 14%, transparent);
  --font-display: 'Noto Serif SC', 'Songti SC', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
  --radius: 10px; --radius-lg: 16px;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.appbar { height: 48px; flex-shrink: 0; display: flex; align-items: center; padding: 0 20px; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
.logo { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.logo-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-size: 14px; }
.appbar .nav { display: inline-flex; gap: 4px; margin-left: 14px; }
.appbar .nav a { font-size: 13.5px; color: var(--muted); padding: 5px 10px; border-radius: 8px; }
.appbar .nav a.on { color: var(--fg); background: var(--fg-soft); font-weight: 500; }
.appbar .spacer { flex: 1; }
.main { flex: 1; width: min(100%, 1080px); margin-inline: auto; padding: 44px 32px 80px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
.page-head h1 { font-family: var(--font-display); font-size: 28px; font-weight: 600; margin: 0; }
.page-head .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
.pill { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; font-size: 11px; line-height: 1.6; font-weight: 500; background: var(--surface); color: var(--muted); white-space: nowrap; }
.pill-status { padding: 2px 9px; }
.pill-ok { background: var(--ok-soft); border-color: transparent; color: color-mix(in oklch, var(--ok) 88%, var(--fg)); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 15px; border-radius: var(--radius); border: 1px solid transparent; font-size: 13.5px; font-weight: 500; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: var(--surface); color: var(--fg); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--fg); }
.btn-sm { height: 28px; padding: 0 12px; font-size: 12.5px; border-radius: 8px; }
.lnk { color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
.lnk:hover { color: var(--accent-strong); text-decoration: underline; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 22px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.panel-h h2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; }
.notice { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; border-radius: 9px; padding: 10px 12px; margin: 0 0 14px; line-height: 1.55; }
.notice svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
.notice.info { background: var(--accent-soft); color: var(--accent-strong); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.dev-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
.dev-row:last-child { border-bottom: 0; }
.dev-host { font-size: 14px; font-weight: 500; }
.dev-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; display: flex; gap: 12px; flex-wrap: wrap; }
.quota-head { display: flex; align-items: baseline; gap: 10px; }
.quota-head .big { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 600; }
.quota-head .small { font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>

<header class="appbar">
  <span class="logo"><span class="logo-mark">爱</span>爱小说</span>
  <nav class="nav">
    <a href="#">首页</a>
    <a href="#">我的套餐</a>
    <a href="#">我的订单</a>
    <a href="#" class="on">我的设备</a>
    <a href="#">我的账户</a>
  </nav>
  <span class="spacer"></span>
  <span class="pill pill-status pill-ok">PRO</span>
</header>

<main class="main">
  <div class="page-head">
    <div>
      <h1>我的设备</h1>
      <div class="sub">套餐在设备上登录后自动绑定；解绑后原设备立即失去同步能力。</div>
    </div>
    <span class="quota-head"><span class="big">2<span style="font-size:14px; color:var(--muted)"> / 5</span></span><span class="small">台已绑定 · 额度按已激活最高档（PRO 包年）</span></span>
  </div>

  <div class="notice info">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
    <span>换新电脑？直接在新设备登录会提示额度；<b>解绑任意旧设备即可腾出名额</b>，解绑即时生效。</span>
  </div>

  <div class="panel" style="padding: 8px 22px">
    <div class="dev-row">
      <div>
        <div class="dev-host">MacBook Pro</div>
        <div class="dev-meta"><span>macOS · 爱小说客户端 v0.12</span><span>最近活跃：今天 14:22</span></div>
      </div>
      <span class="pill pill-status pill-ok">当前设备</span>
      <span></span>
    </div>
    <div class="dev-row">
      <div>
        <div class="dev-host">Mac mini</div>
        <div class="dev-meta"><span>macOS · 爱小说客户端 v0.12</span><span>最近活跃：3 天前</span></div>
      </div>
      <span></span>
      <button class="btn btn-secondary btn-sm">解绑</button>
    </div>
  </div>

  <p style="font-size: 12.5px; color: var(--muted); margin-top: 16px">
    免费版与试用限 1 台；PRO 包月/包季 3 台、包年 5 台。<a class="lnk" href="#">查看我的套餐</a>
  </p>
</main>

<script>
/* MOCK：设备数据示例；解绑为破坏性操作——实现期须弹 in-app 确认（列出设备名），不使用原生 confirm */
</script>
</body>
</html>
