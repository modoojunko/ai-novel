services:
  - type: web
    name: novel-saas-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATA_ROOT
        value: /data/projects
      - key: REFERENCE_DIR
        value: /opt/render/project/src/reference
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: novel-saas-db
          property: connectionString
    disk:
      name: novel-data
      mountPath: /data/projects
      sizeGB: 1

databases:
  - name: novel-saas-db
    plan: free
