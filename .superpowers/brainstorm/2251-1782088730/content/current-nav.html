<div class="section" style="margin-top:1rem">
  <p style="color:color-mix(in srgb, currentColor 60%, transparent);font-size:14px">
    <strong>问题：</strong>
    小说结构是<code>小说→卷→章→正文</code>，但导航却是<code>设定→大纲→细纲→写作→正文</code>。
    「大纲」和「细纲」不是独立页面——它们是卷和章的属性。
