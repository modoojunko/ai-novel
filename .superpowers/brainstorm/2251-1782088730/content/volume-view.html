<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; background: #14100b; color: #e8e0d4; display: flex; justify-content: center; padding: 20px; }
  .app { width: 1100px; border-radius: 12px; overflow: hidden; border: 1px solid #2a241e; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

  .topbar { display: flex; align-items: center; padding: 0 16px; height: 48px; background: #1a1510; border-bottom: 1px solid #2a241e; }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .topbar-title { font-weight: 600; font-size: 14px; color: #e8e0d4; }
  .topbar-tab { padding: 6px 18px; font-size: 13px; color: #6a5a4a; cursor: pointer; border-bottom: 2px solid transparent; }
  .topbar-tab.active { color: #d4a373; border-bottom-color: #d4a373; font-weight: 500; }
  .topbar-spacer { flex: 1; }

  .main { display: flex; min-height: 650px; }
  .left { width: 230px; background: #18130e; border-right: 1px solid #2a241e; display: flex; flex-direction: column; }
  .left-header { padding: 12px 12px 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a241e; }
  .left-header span { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #6a5a4a; }
  .left-tree { flex: 1; padding: 4px 6px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a241e #18130e; }
  .left-tree::-webkit-scrollbar { width: 4px; }
  .left-tree::-webkit-scrollbar-track { background: #18130e; }
  .left-tree::-webkit-scrollbar-thumb { background: #2a241e; border-radius: 2px; }

  .tnode { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; color: #8a7a6a; transition: all 0.1s; }
  .tnode:hover { background: #201a14; }
  .tnode.active { background: #d4a37312; color: #d4a373; font-weight: 500; }
  .tnode .ico { width: 18px; text-align: center; flex-shrink: 0; font-size: 13px; }
  .tnode .lbl { flex: 1; }
  .tnode .badge { font-size: 10px; padding: 1px 7px; border-radius: 8px; flex-shrink: 0; }
  .tnode .badge.cnt { background: #2a241e; color: #6a5a4a; }
  .tnode .badge.done { background: #22c55e12; color: #22c55e; }
  .tnode .badge.writing { background: #f59e0b12; color: #f59e0b; }
  .tnode .badge.draft { background: #3b82f612; color: #3b82f6; }
  .subtree { padding-left: 18px; }

  .left-footer { padding: 10px 12px; border-top: 1px solid #2a241e; }
  .add-row { font-size: 12px; color: #4a4035; padding: 7px 10px; border: 1px dashed #2a241e; border-radius: 5px; cursor: pointer; text-align: center; }
  .add-row:hover { border-color: #d4a37344; color: #d4a373; }

  .right { flex: 1; padding: 24px 36px; overflow-y: auto; background: #16110c; }
  .page-title { font-size: 20px; font-family: "EB Garamond", "Noto Serif SC", serif; font-weight: 600; color: #e8e0d4; margin-bottom: 4px; }
  .page-subtitle { font-size: 12px; color: #6a5a4a; margin-bottom: 20px; }

  .field-group { margin-bottom: 18px; }
  .field-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #6a5a4a; font-weight: 500; margin-bottom: 5px; }
  .field-group .hint { font-size: 11px; color: #4a4035; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .field-group input[type=text], .field-group textarea { width: 100%; background: #1a1510; border: 1px solid #2a241e; border-radius: 5px; padding: 8px 12px; font-size: 13px; color: #e8e0d4; outline: none; font-family: inherit; }
  .field-group input:focus, .field-group textarea:focus { border-color: #d4a37344; }
  .field-group textarea { min-height: 100px; line-height: 1.7; resize: vertical; }

  /* Version bar */
  .version-bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #1a1510; border: 1px solid #2a241e; border-radius: 6px; margin-bottom: 16px; }
  .version-bar .vl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #6a5a4a; }
  .version-bar .vn { font-size: 13px; font-weight: 600; color: #d4a373; }
  .version-bar .vt { font-size: 11px; color: #4a4035; }
  .version-bar .vd { width: 1px; height: 20px; background: #2a241e; }
  .version-bar .vbtn { font-size: 11px; padding: 3px 10px; border-radius: 4px; cursor: pointer; border: 1px solid #2a241e; color: #6a5a4a; }
  .version-bar .vbtn:hover { background: #201a14; color: #b8a08a; }
  .version-bar .vs { flex: 1; }

  .ch-actions { display: flex; gap: 8px; margin-top: 12px; }
  .ch-actions .act { font-size: 11px; color: #6a5a4a; padding: 6px 14px; border-radius: 4px; cursor: pointer; border: 1px solid #2a241e; }
  .ch-actions .act:hover { background: #201a14; color: #b8a08a; }
  .ch-actions .act.primary { background: #d4a37314; border-color: #d4a37344; color: #d4a373; }
  .ch-actions .act.save { background: #22c55e10; border-color: #22c55e44; color: #22c55e; }
  .ch-actions .act.danger { color: #ef4444; border-color: #ef444430; }
  .ch-actions .act.danger:hover { background: #ef444410; }

  .ch-list { display: flex; flex-direction: column; gap: 4px; }
  .ch-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 5px; cursor: pointer; border: 1px solid transparent; }
  .ch-item:hover { background: #1a1510; border-color: #2a241e; }
  .ch-item .drag { font-size: 10px; color: #3a3025; cursor: grab; }
  .ch-item .idx { font-size: 11px; color: #4a4035; min-width: 32px; }
  .ch-item .nm { flex: 1; font-size: 13px; color: #b8a08a; }
  .ch-item .word { font-size: 11px; color: #4a4035; }
  .ch-item .st { font-size: 10px; padding: 1px 6px; border-radius: 8px; }
  .ch-item .st.done { background: #22c55e12; color: #22c55e; }
  .ch-item .st.writing { background: #f59e0b12; color: #f59e0b; }
  .ch-item .st.draft { background: #3b82f612; color: #3b82f6; }
  .ch-item .st.plan { background: #2a241e; color: #6a5a4a; }

  .rpanel { display: none; flex-direction: column; flex: 1; }
  .rpanel.active { display: flex; }

  .empty-hint { font-size: 13px; color: #4a4035; text-align: center; padding: 40px 0; }

  .legend { font-size: 10px; color: #4a4035; display: flex; gap: 12px; margin-top: 12px; }
  .legend span { display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">迷雾中的真相</span>
      <span style="font-size:10px;color:#4a4035;margin-left:4px">悬疑刑侦</span>
    </div>
    <div class="topbar-nav">
      <div class="topbar-tab active">📖 正文</div>
    </div>
    <div class="topbar-spacer"></div>
  </div>

  <div class="main">

    <!-- LEFT TREE: selected volume (not chapter) -->
    <div class="left">
      <div class="left-header"><span>卷 · 章</span><span style="font-size:10px;color:#4a4035">3卷 · 7章</span></div>
      <div class="left-tree">
        <div class="tnode" style="font-weight:500;color:#d4a373">
          <span class="ico">▾</span><span class="lbl">第一卷 · 迷雾</span><span class="badge done">3章</span><span style="font-size:10px;color:#d4a373">← 选中</span>
        </div>
        <div class="subtree">
          <div class="tnode" style="font-size:12px;padding-left:28px">
            <span class="ico"><span style="font-size:10px;color:#4a4035">ch-1</span></span>
            <span class="lbl">不速之客</span><span class="badge done">✓</span>
          </div>
          <div class="tnode" style="font-size:12px;padding-left:28px">
            <span class="ico"><span style="font-size:10px;color:#4a4035">ch-2</span></span>
            <span class="lbl">暗流涌动</span><span class="badge writing">✎</span>
          </div>
          <div class="tnode" style="font-size:12px;padding-left:28px">
            <span class="ico"><span style="font-size:10px;color:#4a4035">ch-3</span></span>
            <span class="lbl">深渊回望</span><span class="badge draft">纲</span>
          </div>
        </div>
        <div class="tnode"><span class="ico">▸</span><span class="lbl">第二卷 · 暗战</span><span class="badge cnt">2章</span></div>
        <div class="tnode"><span class="ico">▸</span><span class="lbl">第三卷 · 终局</span><span class="badge cnt">0章</span></div>
        <div style="margin-top:8px"><div class="add-row">+ 新建卷</div></div>
      </div>
      <div class="left-footer" style="font-size:10px;color:#4a4035;display:flex;gap:12px">
        <span>● 完成</span><span>● 写作中</span><span>● 章纲</span><span>○ 空位</span>
      </div>
    </div>

    <!-- ====== VOLUME EDITOR VIEW ====== -->
    <div class="right">

      <!-- Volume name -->
      <div style="margin-bottom:4px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#6a5a4a">卷</div>
      <div class="page-title">
        <input type="text" value="第一卷 · 迷雾" style="width:100%;background:transparent;border:none;border-bottom:1px solid transparent;font-size:20px;font-family:inherit;font-weight:600;color:#e8e0d4;padding:4px 0;outline:none">
      </div>

      <!-- Version bar for volume -->
      <div class="version-bar" style="margin-top:4px">
        <span class="vl">版本</span>
        <span class="vn">v3</span>
        <span class="vt">· 2026-06-20 15:10</span>
        <span class="vd"></span>
        <span class="vbtn">📋 历史版本</span>
        <span class="vs"></span>
      </div>

      <!-- Volume outline (卷纲) -->
      <div class="field-group">
        <label>卷纲 <span class="hint">这卷讲什么故事，整体起承转合</span></label>
        <textarea placeholder="描述这卷的核心冲突、主要角色的变化、以及如何收尾…">退役刑警林深回到小城雾镇，发现三年前亲手结案的悬案出现新线索。所有证据都指向同一个方向——他自己。他必须在被人发现之前，找到真正的凶手。

本卷核心冲突：林深 vs 自己的过去。起于他回到雾镇，终于他发现真相比想象的更近。</textarea>
      </div>

      <!-- Chapter list -->
      <div style="margin-top:20px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <span style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#6a5a4a">章节 · 共3章</span>
          <span style="font-size:11px;color:#d4a373;cursor:pointer">+ 添加章节</span>
        </div>

        <div class="ch-list">
          <div class="ch-item">
            <span class="drag">⠿</span>
            <span class="idx">01</span>
            <span class="nm">不速之客</span>
            <span class="word">3,280 字</span>
            <span class="st done">✓ 完成</span>
          </div>
          <div class="ch-item" style="background:#1a1510;border-color:#2a241e">
            <span class="drag">⠿</span>
            <span class="idx">02</span>
            <span class="nm">暗流涌动</span>
            <span class="word">1,256 字</span>
            <span class="st writing">✎ 写作中</span>
          </div>
          <div class="ch-item">
            <span class="drag">⠿</span>
            <span class="idx">03</span>
            <span class="nm">深渊回望</span>
            <span class="word">—</span>
            <span class="st draft">纲</span>
          </div>
        </div>

        <div class="legend">
          <span>⠿ 拖拽排序</span>
          <span>点击章节名进入写作</span>
          <span>「+ 添加章节」在末尾追加</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="ch-actions" style="margin-top:20px">
        <span class="act save">💾 保存卷</span>
        <span class="act danger">🗑 删除此卷</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
