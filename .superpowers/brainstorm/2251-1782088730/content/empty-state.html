<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; background: #14100b; color: #e8e0d4; display: flex; justify-content: center; padding: 20px; }
  .app { width: 1100px; border-radius: 12px; overflow: hidden; border: 1px solid #2a241e; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

  .topbar { display: flex; align-items: center; padding: 0 16px; height: 48px; background: #1a1510; border-bottom: 1px solid #2a241e; }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .topbar-title { font-weight: 600; font-size: 14px; color: #e8e0d4; }
  .topbar-tab { padding: 6px 18px; font-size: 13px; color: #6a5a4a; cursor: pointer; border-bottom: 2px solid transparent; }
  .topbar-tab.active { color: #d4a373; border-bottom-color: #d4a373; font-weight: 500; }
  .topbar-spacer { flex: 1; }

  .main { display: flex; min-height: 600px; }
  .left { width: 230px; background: #18130e; border-right: 1px solid #2a241e; display: flex; flex-direction: column; }
  .left-header { padding: 12px 12px 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a241e; }
  .left-header span { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #6a5a4a; }
  .left-tree { flex: 1; padding: 4px 6px; overflow-y: auto; }
  .left-footer { padding: 10px 12px; border-top: 1px solid #2a241e; display: flex; gap: 8px; flex-direction: column; }

  .tnode { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; color: #8a7a6a; }
  .tnode:hover { background: #201a14; }
  .tnode .ico { width: 18px; text-align: center; flex-shrink: 0; font-size: 13px; }
  .tnode .lbl { flex: 1; }

  .right { flex: 1; padding: 40px 48px; overflow-y: auto; background: #16110c; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  .empty-icon { font-size: 48px; margin-bottom: 20px; opacity: 0.3; }
  .empty-title { font-size: 22px; font-family: "EB Garamond", "Noto Serif SC", serif; font-weight: 600; color: #e8e0d4; margin-bottom: 8px; }
  .empty-desc { font-size: 14px; color: #6a5a4a; max-width: 400px; line-height: 1.7; margin-bottom: 28px; }

  .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px; background: #d4a37314; border: 1px solid #d4a37344; border-radius: 8px; color: #d4a373; font-size: 14px; cursor: pointer; }
  .btn-primary:hover { background: #d4a37320; border-color: #d4a37366; }
  .btn-secondary { display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px; background: transparent; border: 1px solid #2a241e; border-radius: 8px; color: #6a5a4a; font-size: 14px; cursor: pointer; }
  .btn-secondary:hover { border-color: #3a3025; color: #8a7a6a; }

  .quick-actions { display: flex; gap: 12px; margin-bottom: 20px; }
  .quick-card { padding: 16px 20px; background: #1a1510; border: 1px solid #2a241e; border-radius: 8px; cursor: pointer; text-align: left; min-width: 160px; }
  .quick-card:hover { border-color: #d4a37344; background: #1d1812; }
  .quick-card .qc-icon { font-size: 24px; margin-bottom: 8px; }
  .quick-card .qc-title { font-size: 13px; font-weight: 500; color: #d8d0c4; }
  .quick-card .qc-desc { font-size: 11px; color: #6a5a4a; margin-top: 4px; }

  .divider { width: 100%; max-width: 400px; height: 1px; background: #2a241e; margin: 16px 0; }
  .hint-text { font-size: 12px; color: #4a4035; line-height: 1.6; max-width: 360px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">迷雾中的真相</span>
      <span style="font-size:10px;color:#4a4035;margin-left:4px">悬疑刑侦</span>
    </div>
    <div class="topbar-nav">
      <div class="topbar-tab">📋 设定</div>
      <div class="topbar-tab active">📖 正文</div>
      <div class="topbar-tab">🔗 线索</div>
    </div>
    <div class="topbar-spacer"></div>
  </div>

  <div class="main">
    <!-- LEFT -->
    <div class="left">
      <div class="left-header"><span>卷 · 章</span><span style="font-size:10px;color:#4a4035">0卷</span></div>
      <div class="left-tree">
        <div style="padding:20px 10px;text-align:center;font-size:12px;color:#4a4035">
          暂无卷和章节<br>
          <span style="font-size:11px">在右侧创建第一卷</span>
        </div>
      </div>
      <div class="left-footer">
        <div style="font-size:11px;color:#4a4035;text-align:center">创建卷后左侧将显示小说结构</div>
      </div>
    </div>

    <!-- RIGHT: Empty state -->
    <div class="right">
      <div class="empty-icon">📖</div>
      <div class="empty-title">开始写你的第一部小说</div>
      <div class="empty-desc">
        先创建一卷，规划故事的整体走向。卷之下再分章节，一章一章写正文。
        可以从头开始，也可以从设定开始。
      </div>

      <!-- Quick action cards -->
      <div class="quick-actions">
        <div class="quick-card">
          <div class="qc-icon">📚</div>
          <div class="qc-title">创建第一卷</div>
          <div class="qc-desc">命名你的第一个故事单元，写卷纲</div>
        </div>
        <div class="quick-card">
          <div class="qc-icon">✍️</div>
          <div class="qc-title">直接写第一章</div>
          <div class="qc-desc">跳过规划，从第一句话开始</div>
        </div>
        <div class="quick-card">
          <div class="qc-icon">📋</div>
          <div class="qc-title">先去设定</div>
          <div class="qc-desc">先搭世界和角色，再动笔</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="hint-text">
        💡 <strong>建议顺序：</strong>先建卷（写卷纲），再在卷下建章（写章纲），最后写正文。
        每一步都可以 AI 辅助，但不是必须的。
      </div>
    </div>
  </div>
</div>
</body>
</html>
