version: "3.9"
services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - novel_data:/data/projects
    depends_on: [backend, frontend]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://novel:novel@postgres:5432/novelsaas
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      AI_API_KEY: ${AI_API_KEY:-}
      DATA_ROOT: /data/projects
    volumes:
      - novel_data:/data/projects
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: /api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel
      POSTGRES_DB: novelsaas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel -d novelsaas"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  novel_data:
